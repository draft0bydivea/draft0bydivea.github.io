<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft 0 by Divéa</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #fff;
            color: #1a1a1a
        }

        :root {
            --gold: #C9A84C;
            --gold-dark: #8B6914;
            --black: #1a1a1a;
            --gray: #6b6b6b;
            --light: #f7f6f3;
            --border: #e8e4dc
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 62px;
            gap: 1rem
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .nav-logo img {
            height: 42px
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0
        }

        .nav-links button {
            background: none;
            border: none;
            cursor: pointer;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: .06em;
            color: var(--gray);
            padding: 7px 10px;
            border-radius: 3px;
            transition: color .2s;
            white-space: nowrap
        }

        .nav-links button:hover,
        .nav-links button.active {
            color: var(--black)
        }

        .nav-links button.active {
            font-weight: 700
        }

        /* HERO */
        .hero {
            background: var(--light);
            padding: 5rem 2rem 4rem;
            text-align: center;
            border-bottom: 1px solid var(--border)
        }

        .hero-eye {
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 1rem
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 400;
            margin-bottom: 1rem
        }

        .hero h1 em {
            font-style: italic;
            color: var(--gold-dark)
        }

        .hero p {
            color: var(--gray);
            font-size: 14px;
            max-width: 460px;
            margin: 0 auto 2rem;
            line-height: 1.9
        }

        .hero-cta {
            background: var(--black);
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: .1em;
            cursor: pointer;
            border-radius: 2px
        }

        .hero-cta:hover {
            background: #333
        }

        /* SECTION LABELS */
        .sec-wrap {
            padding: 2.5rem 2rem
        }

        .sec-label {
            font-size: 9px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: .4rem
        }

        .sec-title {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 1.6rem
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 0 2rem
        }

        /* HOOK CARD */
        .hook-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            max-width: 820px
        }

        .hook-imgwrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #f5f0e8;
            overflow: hidden
        }

        .hook-slides {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform .4s ease
        }

        .hook-slides img {
            min-width: 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            flex-shrink: 0
        }

        .hook-placeholder {
            min-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f0e8, #ede5d0);
            flex-shrink: 0
        }

        .hook-placeholder span {
            font-size: 58px
        }

        .hook-placeholder p {
            font-size: 10px;
            color: var(--gold-dark);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-top: 8px
        }

        .hook-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--gold);
            color: #fff;
            font-size: 9px;
            letter-spacing: .15em;
            text-transform: uppercase;
            padding: 4px 12px;
            z-index: 2
        }

        .cbtn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, .88);
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2
        }

        .cbtn:hover {
            background: #fff
        }

        .cbtn.prev {
            left: 9px
        }

        .cbtn.next {
            right: 9px
        }

        .cdots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 2
        }

        .cdots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .45);
            cursor: pointer;
            transition: background .2s
        }

        .cdots span.on {
            background: #fff
        }

        .hook-info {
            padding: 2.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .hook-cat {
            font-size: 9px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: .7rem
        }

        .hook-name {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: .4rem
        }

        .hook-price {
            font-size: 16px;
            color: var(--gold-dark);
            font-weight: 600;
            margin-bottom: 1rem
        }

        /* STATUS BADGES */
        .s-av {
            display: inline-block;
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 2px;
            margin-bottom: 1.1rem;
            background: #eaf7ef;
            color: #1a6e3c;
            border: 1px solid #b6e4c8
        }

        .s-so {
            display: inline-block;
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 2px;
            margin-bottom: 1.1rem;
            background: #fdf0f0;
            color: #a32d2d;
            border: 1px solid #f5c1c1
        }

        .s-pill-av {
            font-size: 8px;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 2px;
            background: #eaf7ef;
            color: #1a6e3c;
            border: 1px solid #b6e4c8
        }

        .s-pill-so {
            font-size: 8px;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 2px;
            background: #fdf0f0;
            color: #a32d2d;
            border: 1px solid #f5c1c1
        }

        /* MEASUREMENTS */
        .meas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px 14px;
            margin-bottom: 1.3rem
        }

        .meas-l {
            color: var(--gray);
            font-size: 9px;
            letter-spacing: .1em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 1px
        }

        .meas-v {
            font-weight: 600;
            font-size: 12px
        }

        .btn-pri {
            background: var(--black);
            color: #fff;
            border: none;
            padding: 10px 26px;
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: .1em;
            cursor: pointer;
            border-radius: 2px
        }

        .btn-pri:hover {
            background: #333
        }

        /* PRODUCT GRID */
        .pgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 1.4rem
        }

        .pcard {
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: box-shadow .2s
        }

        .pcard:hover {
            box-shadow: 0 4px 18px rgba(0, 0, 0, .08)
        }

        .card-imgwrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #f5f0e8;
            overflow: hidden
        }

        .card-slides {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform .35s ease
        }

        .card-slides img {
            min-width: 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            flex-shrink: 0
        }

        .card-placeholder {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f0e8, #ede5d0);
            font-size: 38px;
            opacity: .7;
            flex-shrink: 0
        }

        .carr {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, .82);
            border: none;
            cursor: pointer;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .2s;
            z-index: 2
        }

        .card-imgwrap:hover .carr {
            opacity: 1
        }

        .carr.prev {
            left: 7px
        }

        .carr.next {
            right: 7px
        }

        .cdots2 {
            position: absolute;
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 2
        }

        .cdots2 span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .45);
            cursor: pointer
        }

        .cdots2 span.on {
            background: #fff
        }

        .cpill-wrap {

            top: 8px;
            right: 8px;
            z-index: 2
        }

        .cthumbs {
            display: flex;
            gap: 4px;
            padding: 5px 7px 0
        }

        .cthumbs img {
            width: 34px;
            height: 34px;
            object-fit: cover;
            border-radius: 2px;
            cursor: pointer;
            border: 1.5px solid transparent;
            opacity: .6;
            transition: opacity .2s, border-color .2s
        }

        .cthumbs img.on {
            border-color: var(--gold);
            opacity: 1
        }

        .pbody {
            padding: .7rem .9rem .9rem

        .p-cat {
            font-size: 8px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 3px
        }

        .p-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 3px
        }

        .p-price {
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 8px
        }

        .pmeas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            border-top: 1px solid var(--border);
            padding-top: 8px
        }

        .pm-l {
            color: var(--gray);
            display: block;
            font-size: 8px;
            letter-spacing: .05em;
            text-transform: uppercase
        }

        .pm-v {
            font-weight: 600;
            font-size: 9px
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 2rem 0 .5rem
        }

        .pagination button {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-family: Georgia, serif;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
            color: var(--gray)
        }

        .pagination button:hover {
            border-color: var(--black);
            color: var(--black)
        }

        .pagination button.cur {
            background: var(--black);
            color: #fff;
            border-color: var(--black)
        }

        .pagination button:disabled {
            opacity: .3;
            cursor: default
        }

        /* CAT PAGE */
        #pg-cat {
            display: none
        }

        .cat-hdr {
            padding: 2rem 2rem .8rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.8rem
        }

        .cat-hdr h1 {
            font-size: 1.9rem;
            font-weight: 400
        }

        .cat-hdr p {
            color: var(--gray);
            font-size: 13px;
            margin-top: 3px
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 5px 14px;
            font-family: Georgia, serif;
            font-size: 11px;
            cursor: pointer;
            border-radius: 2px;
            margin-bottom: .9rem;
            color: var(--gray)
        }

        .back-btn:hover {
            border-color: var(--black);
            color: var(--black)
        }

        footer {
            background: var(--black);
            color: #888;
            text-align: center;
            padding: 1.8rem;
            font-size: 11px;
            letter-spacing: .05em;
            margin-top: 3rem
        }

        footer span {
            color: var(--gold)
        }

        @media(max-width:640px) {
            .hook-card {
                grid-template-columns: 1fr
            }

            nav {
                padding: 0 .8rem
            }

            .hero {
                padding: 2.5rem 1rem
            }

            .hero h1 {
                font-size: 2rem
            }

            .sec-wrap,
            .cat-hdr {
                padding-left: .9rem;
                padding-right: .9rem
            }

            .divider {
                margin: 0 .9rem
            }

            .nav-links button {
                padding: 5px 7px;
                font-size: 11px
            }

            .pgrid {
                grid-template-columns: repeat(2, 1fr);
                gap: .7rem
            }
        }
    </style>
</head>

        // Change index 0 to any other to feature a different product
        const hookProduct = products[0];

        // ── CAROUSEL STATE ────────────────────────────────────────────────────────
        const CS = {};
        function slide(uid, i) {
            const s = document.getElementById(uid + '-s');
            const th = document.getElementById(uid + '-th');
            const d = document.getElementById(uid + '-d');
            if (!s) return;
            const tot = s.children.length;
            i = ((i % tot) + tot) % tot;
            CS[uid] = i;
            s.style.transform = 'translateX(-' + (i * 100) + '%)';
            if (th) Array.from(th.children).forEach((t, j) => t.classList.toggle('on', j === i));
            if (d) Array.from(d.children).forEach((x, j) => x.classList.toggle('on', j === i));
        }

        // ── REAL IMAGES FILTER ────────────────────────────────────────────────────
        function realImgs(imgs) { return (imgs || []).filter(x => x && x.trim() !== '') }

        // ── HOOK CAROUSEL ─────────────────────────────────────────────────────────
        function renderHook() {
            const p = hookProduct;
            const ri = realImgs(p.images);
            const uid = 'hook';
            CS[uid] = 0;
            const zone = document.getElementById('hook-imgzone');
            let sHTML = ri.length
                ? ri.map(src => '<img src="' + src + '" alt="' + p.name + '">').join('')
                : '<div class="hook-placeholder"><span>' + ICONS[p.cat] + '</span><p>' + p.cat + '</p></div>';
            let dotHTML = ri.length > 1
                ? '<div class="cdots" id="hook-d">' + ri.map((_, i) => '<span class="' + (i === 0 ? 'on' : '') + '" onclick="slide(\'hook\',' + i + ')"></span>').join('') + '</div>' : '';
            let arrHTML = ri.length > 1
                ? '<button class="cbtn prev" onclick="slide(\'hook\',CS.hook-1)">&#8592;</button><button class="cbtn next" onclick="slide(\'hook\',CS.hook+1)">&#8594;</button>' : '';
            zone.innerHTML = '<div class="hook-badge">&#10022; Featured</div><div class="hook-slides" id="hook-s">' + sHTML + '</div>' + arrHTML + dotHTML;

            function mr(l, v) { if (!v || v === '—') return ''; return '<div><span class="meas-l">' + l + '</span><span class="meas-v">' + v + '</span></div>'; }
            const avCls = p.av ? 's-av' : 's-so';
            const avTxt = p.av ? '&#10003; Available' : '&#10007; Sold Out';
            document.getElementById('hook-info').innerHTML =
                '<div class="hook-cat">' + p.cat + '</div>' +
                '<div class="hook-name">' + p.name + '</div>' +
                '<div class="hook-price">' + p.price + '</div>' +
                '<span class="' + avCls + '">' + avTxt + '</span>' +
                '<div class="meas">' + mr('Bust', p.bust) + mr('Waist', p.waist) + mr('Shoulder', p.shoulder) + mr('Sleeve', p.sleeve) + mr('Length', p.length) + '</div>' +
                '<button class="btn-pri">' + (p.av ? 'Order Now' : 'Join Waitlist') + '</button>';
        }

        // ── PRODUCT CARD ──────────────────────────────────────────────────────────
        function pCardHome(p) {
            return pCard(p, 'h');
        }

        function pCard(p, uidPrefix) {
            const ri = realImgs(p.images);
            const uid = (uidPrefix || '') + 'p' + p.id;
            CS[uid] = 0;
            let imgZ;
            if (ri.length) {
                const sl = ri.map(src => '<img src="' + src + '" alt="' + p.name + '">').join('');
                const arrs = ri.length > 1
                    ? '<button class="carr prev" data-uid="' + uid + '" data-d="-1">&#8592;</button><button class="carr next" data-uid="' + uid + '" data-d="1">&#8594;</button>' : '';
                const dots = ri.length > 1
                    ? '<div class="cdots2" id="' + uid + '-d">' + ri.map((_, i) => '<span class="' + (i === 0 ? 'on' : '') + '" data-uid="' + uid + '" data-i="' + i + '"></span>').join('') + '</div>' : '';
                const thumbs = ri.length > 1
                    ? '<div class="cthumbs" id="' + uid + '-th">' + ri.map((src, i) => '<img src="' + src + '" class="' + (i === 0 ? 'on' : '') + '" data-uid="' + uid + '" data-i="' + i + '" alt="thumb">').join('') + '</div>' : '';
                imgZ = '<div class="card-imgwrap"><div class="card-slides" id="' + uid + '-s">' + sl + '</div>'
                    + '<div class="cpill-wrap"><span class="' + (p.av ? 's-pill-av' : 's-pill-so') + '">' + (p.av ? 'Available' : 'Sold Out') + '</span></div>'
                    + arrs + dots + '</div>' + thumbs;
            } else {
                imgZ = '<div class="card-imgwrap"><div class="card-slides" id="' + uid + '-s"><div class="card-placeholder">' + ICONS[p.cat] + '</div></div>'
                    + '<div class="cpill-wrap"><span class="' + (p.av ? 's-pill-av' : 's-pill-so') + '">' + (p.av ? 'Available' : 'Sold Out') + '</span></div></div>';
            }
            const mf = [['Bust', p.bust], ['Waist', p.waist], ['Shoulder', p.shoulder], ['Sleeve', p.sleeve], ['Length', p.length], ['Hip', p.hip], ['Leg Opening', p.leg]]
                .filter(([, v]) => v && v !== '—').slice(0, 4)
                .map(([l, v]) => '<div><span class="pm-l">' + l + '</span><span class="pm-v">' + v + '</span></div>').join('');
            return '<div class="pcard">' + imgZ + '<div class="pbody"><div class="p-cat">' + p.cat + '</div>'
                + '<div class="p-name">' + p.name + '</div><div class="p-price">' + p.price + '</div>'
                + '<div class="pmeas">' + mf + '</div></div></div>';
        }

        // ── EVENT DELEGATION ──────────────────────────────────────────────────────
        document.addEventListener('click', function (e) {
            const uid = e.target.dataset && e.target.dataset.uid;
            const d = e.target.dataset && e.target.dataset.d;
            if (uid && d) { slide(uid, CS[uid] + parseInt(d)); return; }
            if (uid && e.target.dataset.i !== undefined) { slide(uid, parseInt(e.target.dataset.i)); return; }
            if (e.target.tagName === 'IMG' && e.target.closest('.cthumbs')) {
                const t = e.target; slide(t.dataset.uid, parseInt(t.dataset.i));
            }
        });

        // ── RENDER HOME GRID (6 previews) ─────────────────────────────────────────
        function renderHomeGrid() {
            // Shuffle products (excluding hookProduct) and pick 6 randomly
            const pool = products.filter(p => p.id !== hookProduct.id);
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
            }
            const pv = pool.slice(0, 6);
            document.getElementById('home-grid').innerHTML = pv.map(function (p) { return pCardHome(p); }).join('');
        }

        // ── CATEGORY TILES ────────────────────────────────────────────────────────
        function renderCatTiles() {
            document.getElementById('cat-tiles').innerHTML = CATS.map(cat => {
                const cnt = products.filter(p => p.cat === cat).length;
                return '<div class="cat-tile" data-cat="' + cat + '" style="border:1px solid var(--border);border-radius:4px;padding:1rem;text-align:center;cursor:pointer;background:#fff;transition:box-shadow .2s"'
                    + ' onmouseover="this.style.boxShadow=\'0 4px 12px rgba(0,0,0,.07)\'" onmouseout="this.style.boxShadow=\'none\'">'
                    + '<div style="font-size:26px;margin-bottom:7px">' + ICONS[cat] + '</div>'
                    + '<div style="font-size:12px;font-weight:500">' + cat + '</div>'
                    + '<div style="font-size:10px;color:var(--gray);margin-top:2px">' + cnt + ' item' + (cnt !== 1 ? 's' : '') + '</div></div>';
            }).join('');
            document.getElementById('cat-tiles').addEventListener('click', function (e) {
                const tile = e.target.closest('.cat-tile');
                if (tile) showCategory(tile.dataset.cat);
            });
        }

        // ── NAVIGATION ────────────────────────────────────────────────────────────
        let currentCat = '', currentPage = 1, currentItems = [];

        function setNav(key) {
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            const el = document.getElementById('nav-' + key.toLowerCase().replace(/\s/g, '-'));
            if (el) el.classList.add('active');
        }

        function showHome() {
            document.getElementById('pg-home').style.display = 'block';
            document.getElementById('pg-cat').style.display = 'none';
            setNav('home'); window.scrollTo(0, 0);
        }

        function showCategory(cat) {
            currentCat = cat;
            currentPage = 1;
            currentItems = cat === 'all' ? products : products.filter(p => p.cat === cat);
            document.getElementById('pg-home').style.display = 'none';
            document.getElementById('pg-cat').style.display = 'block';
            if (cat === 'all') {
                document.getElementById('cat-title').textContent = 'All Products';
            } else {
                document.getElementById('cat-title').textContent = ICONS[cat] + '  ' + cat;
            }
            updateCatPage();
            setNav(cat === 'all' ? 'all' : cat);
            window.scrollTo(0, 0);
        }

        function updateCatPage() {
            const total = currentItems.length;
            const avail = currentItems.filter(p => p.av).length;
            document.getElementById('cat-count').textContent = total + ' product' + (total !== 1 ? 's' : '') + ' \u00b7 ' + avail + ' available';
            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = currentItems.slice(start, start + PER_PAGE);
            document.getElementById('cat-grid').innerHTML = pageItems.length
                ? pageItems.map(pCard).join('')
                : '<p style="color:var(--gray);font-size:13px;padding:2rem 0">No products in this category yet.</p>';
            renderPagination(total);
            window.scrollTo(0, 0);
        }

        function renderPagination(total) {
            const pages = Math.ceil(total / PER_PAGE);
            const pg = document.getElementById('pagination');
            if (pages <= 1) { pg.innerHTML = ''; return; }
            let html = '<button onclick="changePage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '">&#8592; Prev</button>';
            for (let i = 1; i <= pages; i++) {
                html += '<button onclick="changePage(' + i + ')" class="' + (i === currentPage ? 'cur' : '') + '">' + i + '</button>';
            }
            html += '<button onclick="changePage(' + (currentPage + 1) + ')" ' + (currentPage === pages ? 'disabled' : '') + '">Next &#8594;</button>';
            pg.innerHTML = html;
        }

        function changePage(n) {
            const pages = Math.ceil(currentItems.length / PER_PAGE);
            if (n < 1 || n > pages) return;
            currentPage = n;
            updateCatPage();
        }

        function showAllProducts() {
            showCategory('all');
        }

        // ── BUILD NAV ─────────────────────────────────────────────────────────────
        (function () {
            const nav = document.getElementById('nav-links');
            [['Home', 'home'], ['All', 'all'], ...CATS.map(c => [c, c.toLowerCase().replace(/\s/g, '-')])].forEach(([label, key]) => {
                const btn = document.createElement('button');
                btn.id = 'nav-' + key;
                btn.textContent = label;
                btn.onclick = label === 'Home' ? showHome : label === 'All' ? showAllProducts : () => showCategory(label);
                nav.appendChild(btn);
            });
            setNav('home');
        })();
